
workflows:
  ios-build:
    name: Gestion Vehicular - iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Install Flutter dependencies
        script: |
          cd gestionvehicular_mobile
          flutter pub get

      - name: Analyze Flutter project
        script: |
          cd gestionvehicular_mobile
          flutter analyze

      - name: Build iOS application
        script: |
          cd gestionvehicular_mobile
          flutter build ios --release --no-codesign

    artifacts:
      - gestionvehicular_mobile/build/ios/iphoneos/*.app
      - gestionvehicular_mobile/build/ios/**/*.dSYM
