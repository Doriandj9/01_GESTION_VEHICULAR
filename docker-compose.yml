services:
  postgres:
    image: postgres:18
    container_name: gestion-vehicular-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - gestion-vehicular-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./gestionvehicular
      dockerfile: Dockerfile
    container_name: gestion-vehicular-backend
    restart: unless-stopped
    environment:
      #SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      #SPRING_DATASOURCE_URL: jdbc:h2:file:~/gestionvehicular;AUTO_SERVER=TRUE
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gestion-vehicular-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: gestion-vehicular-nginx
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./gestionvehicular_front/dist:/usr/share/nginx/html:ro
      - ./nginx/sites:/etc/nginx/sites:ro
    depends_on:
      - backend
    networks:
      - gestion-vehicular-network

volumes:
  postgres_data:

networks:
  gestion-vehicular-network:
    driver: bridge
